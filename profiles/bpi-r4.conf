# --- BANANA PI BPI-R4 PROFILE ---

# Source: pinned OpenWrt release — never snapshots (they change under us
# and can't be checksum-verified). To bump: update OPENWRT_RELEASE and take
# BUILDER_SHA256 from the target's sha256sums file, e.g.
#   curl -s https://downloads.openwrt.org/releases/<ver>/targets/mediatek/filogic/sha256sums | grep imagebuilder
OPENWRT_RELEASE="25.12.6"
BUILDER_URL="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/mediatek/filogic/openwrt-imagebuilder-${OPENWRT_RELEASE}-mediatek-filogic.Linux-x86_64.tar.zst"
BUILDER_SHA256="8ce0da1e2fb3d0454ebeb1e3df5705f2145e09ffe6f00d5077c18369719daf83"

# Target Board ID (run 'make info' in builder to find these)
BOARD="bananapi_bpi-r4"

# --- PACKAGE DEFINITIONS ---

# 1. System Basics
# zoneinfo-europe: real Olson tz data so `option zonename 'Europe/Dublin'`
# resolves (POSIX TZ alone drifts DST) — matters for camera/IoT timestamps.
PKG_CORE="base-files libc libgcc busybox dropbear mtd uci netifd fstools \
          htop tcpdump nano git curl wget-ssl python3 python3-pip \
          zoneinfo-europe"

# kmod-nvme: ap-upstairs' M.2 SSD (LXC storage) — NOT in the board defaults,
# so without this the Crucial P3 is invisible to the kernel.
PKG_HW="kmod-sfp kmod-hwmon-pwmfan ethtool-full pciutils usbutils \
        kmod-usb-storage kmod-fs-ext4 kmod-fs-vfat kmod-nvme"

# 3. Network Smarts (Roaming, VPN, Metrics)
# Exporter collectors are baked in so Ansible only enables the service.
# wpad-mbedtls (full): DAWN needs hostapd's ubus interface, which the basic
# build omits; with basic, DAWN loads but never steers a client.
# avahi-nodbus-daemon: mDNS reflector across the VLANs (Ansible picks which).
# netbird: the router joins the fleet's NetBird mesh.
PKG_NET="hostapd-utils dawn netbird \
         wpad-mbedtls -wpad-basic-mbedtls \
         avahi-nodbus-daemon \
         prometheus-node-exporter-lua prometheus-node-exporter-lua-netstat \
         prometheus-node-exporter-lua-openwrt prometheus-node-exporter-lua-wifi \
         kmod-tun kmod-wireguard kmod-ipt-nat kmod-nft-nat"

# 4. Container Support (LXC + Podman)
PKG_VIRT="lxc lxc-templates lxc-auto \
          kmod-veth kmod-macvlan \
          losetup resize2fs fdisk zram-swap"

# 5. Management & Monitoring (SQM, Stats, Health)
# node-exporter feeds the fleet Prometheus; collectd/RRD feeds the local LuCI
# graphs. thermal matters (the board runs hot); smartmontools watches the NVMe.
PKG_MGMT="luci-app-sqm \
          luci-app-statistics collectd-mod-sensors collectd-mod-cpu collectd-mod-memory collectd-mod-interface \
          collectd-mod-conntrack collectd-mod-thermal collectd-mod-load collectd-mod-uptime \
          smartmontools"

# 6. Security. banip sets live in RAM, so keep its feeds few.
# No CrowdSec: 25.12's `crowdsec` and `crowdsec-firewall-bouncer` both ship
# /etc/config/crowdsec and apk refuses the overwrite. roles/crowdsec stays,
# gated by crowdsec_enable; re-add both packages once openwrt/packages#28615
# is fixed.
PKG_SEC="banip"
PKG_VPN="wireguard-tools luci-proto-wireguard"
PKG_DNS="adguardhome"

# 7. UI: a LuCI app per service so each shows in the menu. luci-theme-material
# (unlike argon) is in the official feed, so the pinned ImageBuilder has it;
# roles/ui makes it the default.
PKG_UI="luci-theme-material \
        luci-app-banip luci-app-dawn \
        luci-app-nlbwmon nlbwmon"

# Combined List
PACKAGES="$PKG_CORE $PKG_HW $PKG_NET $PKG_VIRT $PKG_MGMT $PKG_SEC $PKG_VPN $PKG_DNS $PKG_UI luci luci-ssl -dnsmasq dnsmasq-full"

# Services to disable on first boot (Ansible will handle them)
DISABLED_SERVICES="dnsmasq odhcpd"
