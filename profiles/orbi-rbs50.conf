# --- NETGEAR ORBI RBS50 v1 PROFILE (access point) ---
# Same DTS as the RBR50, only the board id differs, so everything else comes
# from orbi-rbr50.conf. Check v1 before flashing: a USB port on the back
# means v1; no USB port = v2 (NAND), unsupported.
BOARD="netgear_rbs50"
# shellcheck disable=SC1091 # same-repo sibling profile, path relative to the repo root
source "profiles/orbi-rbr50.conf"
