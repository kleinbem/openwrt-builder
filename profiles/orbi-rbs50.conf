# --- NETGEAR ORBI RBS50 v1 PROFILE (access point) ---
#
# The satellite is the RBR50 minus the port label: OpenWrt builds both from
# one DTS with only the Netgear board id differing (generic.mk
# netgear_rbx50). Everything — release pin, packages, size budget, install
# notes — is shared with orbi-rbr50.conf; only BOARD changes.
#
# Satellite(s) still need the v1 check before flashing: a USB port on the
# back means v1; no USB port = v2 (NAND) = not supported by this image.
BOARD="netgear_rbs50"
# shellcheck disable=SC1091 # same-repo sibling profile, path relative to the repo root
source "profiles/orbi-rbr50.conf"
