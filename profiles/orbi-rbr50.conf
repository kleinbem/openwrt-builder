# --- NETGEAR ORBI RBR50 v1 PROFILE (access point) ---
#
# The Orbi units (one RBR50 "router" + RBS50 satellites) outlived Netgear's
# support and run Voxel firmware today; under OpenWrt they become plain
# wired access points behind the BPI-R4s — Orbi's proprietary mesh does not
# exist in OpenWrt (roaming = 802.11r/k/v + DAWN like every other AP here).
#
# v1 ONLY (verified 2026-10-20: `artmtd -r hw_revision` empty, 4 GB eMMC
# `mmcblk0`). v2 units (SPI NAND, no USB port, hw_revision 02) are still an
# open upstream PR (openwrt/openwrt#22321) — this image will not boot there.
#
# Install (from Voxel/stock): nmrpflash with the *-factory.img on the LAN
# port nearest the power button; or via the OEM web UI only after switching
# to boot partition 2 (`artmtd -w boot_part 02`, reboot) because OpenWrt
# runs from partition 1 and the UI always flashes the inactive one.
# Revert: nmrpflash with a stock .img. Details: openwrt/docs/SYSTEM_REFERENCE.md.

# Source: pinned OpenWrt release — never snapshots. Same release as bpi-r4 so
# the fleet runs one OpenWrt version; bump both together (see bpi-r4.conf).
#   curl -s https://downloads.openwrt.org/releases/<ver>/targets/ipq40xx/generic/sha256sums | grep imagebuilder
OPENWRT_RELEASE="25.12.6"
BUILDER_URL="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/ipq40xx/generic/openwrt-imagebuilder-${OPENWRT_RELEASE}-ipq40xx-generic.Linux-x86_64.tar.zst"
BUILDER_SHA256="9e377a6c51ad667b6aa277934714174467b44723b1456153317d7a4aef3f1fd2"

# Target Board ID (ImageBuilder `make info`). RBS50 = same image recipe,
# different board id — see orbi-rbr50.conf's sibling orbi-rbs50.conf.
BOARD="${BOARD:-netgear_rbr50}"

# Size budget: the Netgear DNI factory image must fit the eMMC kernel+rootfs
# slot. OpenWrt's generic.mk pins IMAGE_SIZE := 36175872 (34.5 MiB, rootfs
# ≤ 30.75 MiB) for rbx50 but the image recipe has no check-size step, so
# build.sh asserts it here instead — an oversized rootfs would otherwise
# silently eat the overlay space. Keep the package list lean (no Go
# binaries: netbird alone is ~15 MiB compressed, so this AP is reached over
# the LAN / via the gateway's NetBird instead).
IMAGE_MAX_BYTES=36175872

# --- PACKAGE DEFINITIONS ---

# 1. System basics — python3 for Ansible (openwrt-config), tz data for
# correct local timestamps (zonename needs zoneinfo-europe).
PKG_CORE="base-files libc libgcc busybox dropbear mtd uci netifd fstools \
          htop tcpdump nano curl python3 \
          zoneinfo-europe"

# 2. Wi-Fi + roaming — wpad-mbedtls (FULL) replaces wpad-basic: DAWN needs
# hostapd's ubus interface; also gives 802.11r/k/v + WPA3 on ath10k. The
# QCA9984 firmware (ath10k-firmware-qca9984-ct) is a board default.
PKG_NET="hostapd-utils dawn luci-app-dawn \
         wpad-mbedtls -wpad-basic-mbedtls \
         prometheus-node-exporter-lua prometheus-node-exporter-lua-netstat \
         prometheus-node-exporter-lua-openwrt prometheus-node-exporter-lua-wifi"

# 3. Monitoring — same collectors as the BPI-R4 minus NVMe/conntrack (no
# routing, no SSD). thermal: the IPQ4019 reports SoC temperature.
PKG_MGMT="luci-app-statistics collectd-mod-cpu collectd-mod-memory collectd-mod-interface \
          collectd-mod-thermal collectd-mod-load collectd-mod-uptime collectd-mod-iwinfo"

# 4. UI — same theme as the BPI-R4s so the fleet looks alike.
PKG_UI="luci-theme-material"

# Combined List. No -dnsmasq/dnsmasq-full swap: an AP never serves DHCP
# (dnsmasq + odhcpd are disabled below; the gateway owns DHCP/DNS).
PACKAGES="$PKG_CORE $PKG_NET $PKG_MGMT $PKG_UI luci luci-ssl"

# Services to disable on first boot (Ansible will handle them)
DISABLED_SERVICES="dnsmasq odhcpd"
