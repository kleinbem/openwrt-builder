version: 2
updates:
  # Keeps pinned actions current. One grouped PR a week instead of one per
  # action; the cooldown skips releases younger than a week.
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base images (FROM lines). Majors such as ubuntu 24.04 -> 26.04 come alone.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
