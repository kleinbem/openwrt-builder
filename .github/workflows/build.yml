name: OpenWrt Builder

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools (Just)
        uses: extractions/setup-just@v2

      - name: Install Tools (Podman)
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      # The build recipe wipes openwrt-imagebuilder-* on every run, so cache
      # the persistent package download dir instead (symlinked into the
      # builder by build.sh).
      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-openwrt-dl-bpi-r4-${{ hashFiles('profiles/bpi-r4.conf') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-bpi-r4-

      - name: Build Firmware
        # Runs WITHOUT secrets for public/CI builds — verifies the pinned
        # ImageBuilder (sha256-checked) and package selection are valid.
        run: just build bpi-r4

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-bpi-r4-images
          path: dist/*
