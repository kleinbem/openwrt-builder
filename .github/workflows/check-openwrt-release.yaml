name: "Check OpenWrt release"

# Opens an issue for an OpenWrt release bump, never applies it: a bad image
# can brick a router with no console (see scripts/check-openwrt-release.sh).

on:
  schedule:
    # Sundays 05:00 UTC — a day ahead of build.yml's own weekly Monday
    # rebuild, so a fresh release is flagged before that run.
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/check-openwrt-release.sh
          ./scripts/check-openwrt-release.sh
